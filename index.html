<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ECO KPI</title>
<style>html,body{margin:0;height:100%;background:#0e1116}
#f{border:0;width:100%;height:100vh;height:100dvh;display:none}
#land{display:none;min-height:100vh;align-items:center;justify-content:center;text-align:center;
padding:24px;color:#e8eaed;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
#land div{max-width:420px}#land h1{font-size:20px;margin:0 0 10px}#land p{color:#9aa3b2;line-height:1.6;font-size:15px}</style>
</head><body>
<div id="land"><div><h1>ECO KPI</h1><p>请使用你收到的专属链接打开你的个人报告。<br>Please open your personal report using the private link you were given.</p></div></div>
<iframe id="f" title="report"></iframe>
<script>
function go(){
  var p=new URLSearchParams(location.hash.slice(1));
  var t=p.get('t'), all=p.get('all'), src=null;
  if(t && /^[a-f0-9]{12}$/.test(t)) src='p/'+t+'.html';
  else if(all && /^[a-f0-9]{12}$/.test(all)) src='m/'+all+'.html';
  var f=document.getElementById('f'), l=document.getElementById('land');
  if(src){ if(f.getAttribute('src')!==src) f.setAttribute('src',src); f.style.display='block'; l.style.display='none'; }
  else { f.style.display='none'; l.style.display='flex'; }
}
addEventListener('hashchange',go); go();
</script></body></html>
